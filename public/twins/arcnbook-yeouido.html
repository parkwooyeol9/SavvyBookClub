<!doctype html>
<html lang="ko" class="embed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>아크앤북 여의도 트윈 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 정보 바 + 좌측 3D 스테이지(오버레이 도구) + 우측 상세 패널. 폰에서는 패널이 하단 시트로 내려감 */
:root{
  --bg:#eceee9; --surface:#fafaf7; --surface-2:#f0f2ed; --fg:#1b2220; --muted:#5a6560; --line:#d2d8d2;
  --accent:#1d6b58; --accent-ink:#ffffff; --warn:#b7791f;
  --scene:#e2e6e0; --floor:#d9d2c4; --corridor:#a9adab; --wall:#efede6; --wood:#b48c62; --staff:#c9ccc6;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#181d1b; --surface-2:#1f2522; --fg:#e3e8e5; --muted:#93a19a; --line:#2c3531;
  --accent:#5cc0a2; --accent-ink:#0c1a15; --warn:#e0a84a;
  --scene:#0e1210; --floor:#2e2a24; --corridor:#3b3f3e; --wall:#363c38; --wood:#80603f; --staff:#2a2f2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#181d1b; --surface-2:#1f2522; --fg:#e3e8e5; --muted:#93a19a; --line:#2c3531;
  --accent:#5cc0a2; --accent-ink:#0c1a15; --warn:#e0a84a;
  --scene:#0e1210; --floor:#2e2a24; --corridor:#3b3f3e; --wall:#363c38; --wood:#80603f; --staff:#2a2f2c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{margin-left:auto;font-size:11.5px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
#stage{position:relative;min-width:0;min-height:0;background:var(--scene);overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
aside{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:18px 18px 28px;min-width:0}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,44%)}
  aside{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
}
.tools{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;align-items:flex-start}
.tools>*{pointer-events:auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button,.btn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button:hover,.btn:hover{color:var(--fg);background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative}
.search input{width:230px;max-width:calc(100vw - 48px);font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.results{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;width:max-content;max-width:min(360px,calc(100vw - 48px));background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;margin:0;list-style:none;z-index:5}
.results button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--fg);font:inherit;font-size:12.5px;padding:6px 8px;border-radius:6px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results span{color:var(--muted);white-space:nowrap}
.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:5px;color:var(--fg)}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.legend .mut{color:var(--muted)}
.hint{position:absolute;right:12px;bottom:12px;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(12px,12px);max-width:320px;overflow:hidden;text-overflow:ellipsis}
aside h2{font-size:16px;margin:0 0 10px;font-weight:600;text-wrap:balance}
aside h3{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:22px 0 8px;text-transform:uppercase}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}
.sid{font-family:var(--font-mono);font-size:26px;letter-spacing:-.01em;margin:0 0 2px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.zl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.zl button{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;width:100%;border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:6px;border-radius:6px;cursor:pointer;text-align:left}
.zl button:hover{background:var(--surface-2)}
.zl .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.zl .id{font-family:var(--font-mono);font-size:12px}
.books{list-style:none;margin:0;padding:0;font-size:13px}
.books li{display:flex;gap:8px;align-items:baseline;padding:5px 4px;border-bottom:1px solid var(--line)}
.books li.hl{background:var(--surface-2)}
.books .no{font-family:var(--font-mono);font-size:11px;color:var(--muted);width:18px;flex:none;text-align:right}
.books .t{flex:1;min-width:0}
.books .y{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:10.5px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border:1px solid var(--line);color:var(--fg)}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}
aside h2 .count{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.inv-q{width:100%;font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 10px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.inv-wrap{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.inv{width:100%;border-collapse:collapse;font-size:12.5px}
.inv th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:500;color:var(--muted);padding:6px 8px}
.inv td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.inv td:nth-child(2){color:var(--muted);white-space:nowrap}
.inv .loc{font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
.inv .loc span{font-family:var(--font-body);color:var(--muted)}
.inv tbody tr{cursor:pointer}
.inv tbody tr:hover{background:var(--surface-2)}
.inv .empty{color:var(--muted);text-align:center;cursor:default}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
/* SavvyBookClub 임베드(html.embed): 사이트 헤더가 대신하고, 사이트 팔레트(라이트 전용)를 따른다 */
:root.embed{
  --bg:#f3eee4; --surface:#faf7f0; --surface-2:#ece6da; --fg:#0f1c2e; --muted:#4d5a68; --line:#d9d2c4;
  --accent:#5c6b4a; --accent-ink:#ffffff; --warn:#a8641e;
  --scene:#e8e2d6; --floor:#d6cfc0; --corridor:#a9a69e; --wall:#efe9dd; --wood:#a9845a; --staff:#cfc8ba; color-scheme:light}
:root.embed header{display:none}
</style>

<div class="app">
  <header>
    <h1>아크앤북 여의도 트윈<small>시안 v0.2</small></h1>
    <div class="meta" id="meta">TP타워 B2</div>
    <span class="badge">비공식 검토용 · 평면은 피난안내도 기준 · 서가 배치 일부 추정</span>
  </header>
  <main>
    <div id="stage">
      <div class="loading" id="loading">3D 모델을 불러오는 중…</div>
      <div class="tools">
        <div class="seg" role="group" aria-label="시점">
          <button id="v-iso" aria-pressed="true">전체</button>
          <button id="v-top" aria-pressed="false">평면</button>
          <button id="v-tunnel" aria-pressed="false">북터널</button>
          <button id="v-daily" aria-pressed="false">DAILY 서가</button>
          <button id="v-insp" aria-pressed="false">INSPIRATION 서가</button>
        </div>
        <div class="seg" role="group" aria-label="책 색상">
          <button id="c-read" aria-pressed="true">식별 도서</button>
          <button id="c-zone" aria-pressed="false">존별</button>
          <button id="c-real" aria-pressed="false">실물색</button>
        </div>
        <div class="seg"><button id="t-label" aria-pressed="true">라벨</button></div>
        <div class="search">
          <input id="q" type="search" placeholder="책 제목, 서가 ID(D-02), 존 검색" autocomplete="off" aria-label="검색">
          <ul class="results" id="results" hidden></ul>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="hint">드래그 회전 · 우클릭/두 손가락 이동 · 휠 확대 · WASD 걷기</div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside id="panel"></aside>
  </main>
</div>

  g.fillStyle=bg;const r=20;g.beginPath();g.moveTo(r,0);g.arcTo(c.width,0,c.width,c.height,r);g.arcTo(c.width,c.height,0,c.height,r);g.arcTo(0,c.height,0,0,r);g.arcTo(0,0,c.width,0,r);g.fill();
  g.fillStyle=fg;g.textBaseline='middle';g.fillText(text,30,c.height/2+1);
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,sizeAttenuation:false}));
  const hgt=small?0.024:0.03;sp.scale.set(hgt*c.width/c.height,hgt,1);sp.position.copy(pos);sp.renderOrder=10;scene.add(sp);labels.push(sp);}
function buildLabels(){
  const dark='rgba(32,38,36,0.88)',lite='#f3f5f2';
  ZONES.forEach(zn=>{const[x0,x1,z0,z1]=zn.rect;makeLabel(zn.name+' · '+zn.ko,zn.color,'#ffffff',new THREE.Vector3((x0+x1)/2,3.1,(z0+z1)/2));});
  FAC.forEach(fc=>{if(fc.id==='staff1')return;const[x0,x1,z0,z1]=fc.rect;makeLabel(fc.ko,dark,lite,new THREE.Vector3((x0+x1)/2,fc.id==='tunnel'?3.8:2.9,(z0+z1)/2),fc.staff);});
  makeLabel('출입구 · 여의도역 방면',dark,lite,new THREE.Vector3(-21.5,0.6,-0.9),true);
  makeLabel('비상구',dark,lite,new THREE.Vector3(20.8,0.6,-0.7),true);
  makeLabel('공용복도',dark,lite,new THREE.Vector3(-3.35,0.6,-11.5),true);
  makeLabel('38.6 m (도면 환산)','rgba(32,38,36,0.75)',lite,new THREE.Vector3(0,0.3,18.6),true);
  makeLabel('29.6 m (도면 환산)','rgba(32,38,36,0.75)',lite,new THREE.Vector3(22.6,0.3,0),true);
}
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(buildLabels);

// ---------- 색상 ----------
let colorMode='read', selFace=-1, hiZone=null, hiBook=-1;
function paintBooks(){
  const acc=new THREE.Color(tok.accent),warn=new THREE.Color(tok.warn);
  sample.forEach((b,i)=>bookMesh.setColorAt(i,colorMode==='read'?GREY:colorMode==='zone'&&b.zc?b.zc:b.real));
  reads.forEach((r,i)=>{let c;
    if(i===hiBook) c=new THREE.Color('#ff3b6b');
    else if(colorMode==='read') c=r.book.c==='H'?acc:warn;
    else if(colorMode==='zone') c=new THREE.Color(faces[r.face].zone.color).offsetHSL(0,0,((hash(r.book.t)%30)-15)/100);
    else c=REAL[hash(r.book.t)%REAL.length];
    readMesh.setColorAt(i,c);});
  bookMesh.instanceColor.needsUpdate=true; if(readMesh.instanceColor) readMesh.instanceColor.needsUpdate=true;}
function paintWood(){const base=new THREE.Color(tok.wood),acc=new THREE.Color(tok.accent),tbl=new THREE.Color('#c9a878');
  faces.forEach((f,i)=>{const c=i===selFace?acc:(hiZone===f.zone.id?base.clone().lerp(new THREE.Color(f.zone.color),0.6):base);
    for(let k=0;k<WOODN;k++)woodMesh.setColorAt(f.w0+k,c); woodMesh.setColorAt(f.w0+WOODN,i===selFace?acc:tbl);});
  woodMesh.instanceColor.needsUpdate=true;}
function applyTheme(){readTok();scene.background=new THREE.Color(tok.scene);mats.floor.color.set(tok.floor);mats.corridor.color.set(tok.corridor);
  mats.wall.color.set(tok.wall);mats.staff.color.set(tok.staff);dimMat.color.set(tok.muted);paintWood();paintBooks();}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// ---------- 카메라 ----------
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let fly=null;
function flyTo(pos,tgt){if(reduce){camera.position.copy(pos);controls.target.copy(tgt);return;}
  fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,s:performance.now(),dur:1100};}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const VIEWS={'v-iso':[V(24,32,36),V(0,0,0)],'v-top':[V(0,62,0.01),V(0,0,0)],'v-tunnel':[V(-21,1.6,-0.9),V(-4,1.6,-0.9)],
  'v-daily':[V(15.9,1.8,3.85),V(18.4,1.2,3.85)],'v-insp':[V(3.5,1.8,-11.6),V(3.5,1.2,-14.7)]};
function setPressed(ids,id){ids.forEach(k=>$('#'+k).setAttribute('aria-pressed',k===id?'true':'false'));}
const clearView=()=>setPressed(Object.keys(VIEWS),'');
Object.keys(VIEWS).forEach(id=>$('#'+id).addEventListener('click',()=>{setPressed(Object.keys(VIEWS),id);flyTo(VIEWS[id][0].clone(),VIEWS[id][1].clone());}));
const front=f=>V(Math.sin(f.rot),0,Math.cos(f.rot));
function flyToFace(f){const n=front(f),side=V(n.z,0,-n.x);flyTo(V(f.x,1.8,f.z).addScaledVector(n,2.8).addScaledVector(side,0.7),V(f.x,1.1,f.z));}
function flyToRect(r){const cx=(r[0]+r[1])/2,cz=(r[2]+r[3])/2,s=Math.max(r[1]-r[0],r[3]-r[2]);flyTo(V(cx+s*0.7,s*1.1+3,cz+s*0.9),V(cx,0.5,cz));}

// ---------- 도구 ----------
const CM={'c-read':'read','c-zone':'zone','c-real':'real'};
Object.keys(CM).forEach(id=>$('#'+id).addEventListener('click',()=>{setPressed(Object.keys(CM),id);colorMode=CM[id];paintBooks();renderLegend();}));
$('#t-label').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);labels.forEach(l=>l.visible=on);});
function renderLegend(){const L=$('#legend');
  if(colorMode==='read')L.innerHTML=`<span class="k"><i class="dot" style="background:var(--accent)"></i>식별 도서 ${nReadH}권</span><span class="k"><i class="dot" style="background:var(--warn)"></i>제목 추정 ${reads.length-nReadH}권</span>`;
  else if(colorMode==='zone')L.innerHTML=ZONES.map(z=>`<span class="k"><i class="dot" style="background:${z.color}"></i>${z.name}</span>`).join('')+'<span class="mut">북터널은 실물색</span>';
  else L.innerHTML='<span class="mut">실물 느낌 색상(임의). 표지색은 아직 반영하지 않았습니다</span>';}
renderLegend();

// ---------- 패널 ----------
const panel=$('#panel');
const realFaces=faces.map((f,i)=>({f,i})).filter(o=>o.f.real);
// 소장 도서 목록: 분류 → 서가 → 진열 순서
const inventory=reads.map((r,i)=>({i,r,f:faces[r.face]})).sort((a,b)=>a.f.real.cat.localeCompare(b.f.real.cat,'ko')||a.f.id.localeCompare(b.f.id)||Object.keys(DATA.tierNames).indexOf(a.r.tier)-Object.keys(DATA.tierNames).indexOf(b.r.tier)||a.r.idx-b.r.idx);
const cats=[...new Set(inventory.map(o=>o.f.real.cat))];
let invCat='', invQ='';
function renderInventory(){
  const nq=norm(invQ), rows=inventory.filter(o=>(!invCat||o.f.real.cat===invCat)&&(!nq||norm(o.r.book.t).includes(nq)));
  $('#inv-count').textContent=`${rows.length}권`;
  $('#inv-body').innerHTML=rows.map(o=>`<tr data-book="${o.i}"><td>${esc(o.r.book.t)}${o.r.book.c==='M'?'<span class="tag">추정</span>':''}</td><td>${esc(o.f.real.cat)}</td><td class="loc">${o.f.id}<br><span>${DATA.tierNames[o.r.tier]}</span></td></tr>`).join('')
    ||'<tr><td colspan="3" class="empty">찾는 책이 없습니다.</td></tr>';
}
function overview(){
  panel.innerHTML=`<h2>소장 도서 <span class="count" id="inv-count"></span></h2>
  <input id="inv-q" class="inv-q" type="search" placeholder="제목으로 찾기" autocomplete="off" aria-label="소장 도서 검색" value="${esc(invQ)}">
  <div class="chips" role="group" aria-label="분류">${['',...cats].map(c=>`<button data-cat="${esc(c)}" aria-pressed="${c===invCat}">${c||'전체'}</button>`).join('')}</div>
  <div class="inv-wrap"><table class="inv"><thead><tr><th>제목</th><th>분류</th><th>위치</th></tr></thead><tbody id="inv-body"></tbody></table></div>
  <p class="note">행을 누르면 그 책이 꽂힌 서가로 이동합니다. '추정'은 책등이 일부만 보여 제목을 추론한 책입니다.</p>
  <h3>매장</h3>
  <dl><dt>위치</dt><dd>TP타워 지하 2층 · 여의도역 방면 공용복도 연결</dd>
  <dt>면적</dt><dd>기사 약 320평 · 도면 환산 약 1,036㎡(313평)</dd>
  <dt>외곽 치수</dt><dd>38.6 × 29.6 m (피난안내도 비율 환산)</dd></dl>
  <h3>존</h3><ul class="zl">${ZONES.map(z=>`<li><button data-zone="${z.id}"><i class="dot" style="background:${z.color}"></i><span>${z.name}</span><span class="n">${esc(z.ko)} · ${faces.filter(f=>f.zone===z).length}면</span></button></li>`).join('')}</ul>
  <p class="note">외곽선, 존 경계, 공용복도, 기둥, 출입구는 피난안내도를 따릅니다. 서가의 매장 내 위치와 좌석·집기 배치는 추정입니다.</p>`;
  renderInventory();
  $('#inv-q').addEventListener('input',e=>{invQ=e.target.value;renderInventory();});
  panel.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{invCat=b.dataset.cat;panel.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderInventory();}));
  $('#inv-body').addEventListener('click',e=>{const tr=e.target.closest('tr[data-book]');if(tr)focusBook(+tr.dataset.book);});
  panel.querySelectorAll('[data-zone]').forEach(b=>b.addEventListener('click',()=>selectZone(b.dataset.zone)));
}
function focusBook(i){const r=reads[i];showFace(r.face,i);clearView();flyToFace(faces[r.face]);}
// 상위 페이지(SavvyBookClub /arcnbook)의 표에서 책을 고르면 해당 서가로 이동
addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;
  if(!d||d.type!=='arcnbook:focus')return;
  const i=reads.findIndex(r=>faces[r.face].id===d.shelf&&r.tier===d.tier&&r.idx===d.idx);if(i>=0)focusBook(i);});
function showFace(i,bookIdx){
  const f=faces[i];selFace=i;hiZone=null;hiBook=bookIdx==null?-1:bookIdx;paintWood();paintBooks();
  const head=`<div class="eyebrow"><i class="dot" style="background:${f.zone.color}"></i>${f.zone.name} · ${esc(f.zone.ko)}</div>
  <p class="sid">${f.id}</p><div class="eyebrow">${f.wall?'벽면 서가':'양면 서가'}${f.real?` · ${esc(f.real.cat)}`:''}</div>
  <div class="row"><button class="btn primary" id="go">이 서가로 이동</button><button class="btn ghost" id="close">소장 도서 목록</button></div>`;
  if(!f.real){panel.innerHTML=head+`<p class="note">이 서가의 도서 목록은 아직 없습니다.</p>`;}
  else{const hb=hiBook>=0?reads[hiBook]:null;
    panel.innerHTML=head+Object.entries(DATA.tierNames).map(([k,name])=>{const lst=f.real.tiers[k]||[];if(!lst.length)return'';
      return `<h3>${name} · ${lst.length}권</h3><ul class="books">${lst.map((b,j)=>`<li class="${hb&&hb.tier===k&&hb.idx===j?'hl':''}"><span class="no">${j+1}</span><span class="t">${esc(b.t)}${b.c==='M'?'<span class="tag">추정</span>':''}${b.a?`<br><span class="y">${esc(b.a)} · ${esc(b.p)}</span>`:''}</span>${b.y?`<span class="y">${b.y}</span>`:''}</li>`).join('')}</ul>`;}).join('')
      +`<p class="note">'추정'은 책등이 일부만 보여 제목을 추론한 책입니다.</p>`;}
  $('#go').addEventListener('click',()=>{clearView();flyToFace(f);});
  $('#close').addEventListener('click',reset);
  const hl=panel.querySelector('li.hl'); if(hl) hl.scrollIntoView({block:'center'});
}
function showFac(fc){selFace=-1;hiZone=null;hiBook=-1;paintWood();paintBooks();
  panel.innerHTML=`<div class="eyebrow">시설 · 도면 표기 ${esc(fc.name)}</div><h2>${esc(fc.ko)}</h2><p style="font-size:13.5px;line-height:1.6;margin:0">${esc(fc.desc)}</p>
  <div class="row"><button class="btn primary" id="go">이 위치로 이동</button><button class="btn ghost" id="close">개요로</button></div>`;
  $('#go').addEventListener('click',()=>{clearView();flyToRect(fc.rect);});$('#close').addEventListener('click',reset);}
function selectZone(id){const z=ZONES.find(z=>z.id===id);selFace=-1;hiZone=id;hiBook=-1;paintWood();paintBooks();clearView();flyToRect(z.rect);}
function reset(){selFace=-1;hiZone=null;hiBook=-1;paintWood();paintBooks();overview();}
overview();
$('#meta').textContent=`TP타워 B2 · 도면 환산 약 1,036㎡ · 서가 ${faces.length}면 · 식별 도서 ${fmt(reads.length)}권`;

// ---------- 검색 ----------
const q=$('#q'),res=$('#results');
function search(s){s=s.trim();if(!s)return[];const out=[],up=s.toUpperCase().replace(/\s/g,''),ns=norm(s);
  const m=up.match(/^([ISWD])-?0*(\d{1,2})$/);
  if(m){const id=m[1]+'-'+m[2].padStart(2,'0');const i=faces.findIndex(f=>f.id===id);if(i>=0)out.push({label:id,sub:faces[i].real?faces[i].real.cat:faces[i].zone.name,go:()=>{showFace(i);clearView();flyToFace(faces[i]);}});}
  if(ns.length>=2) reads.forEach((r,i)=>{if(out.length<8&&norm(r.book.t).includes(ns))out.push({label:r.book.t,sub:faces[r.face].id+' · '+DATA.tierNames[r.tier],go:()=>{showFace(r.face,i);clearView();flyToFace(faces[r.face]);}});});
  ZONES.forEach(z=>{if(norm(z.name+z.ko).includes(ns))out.push({label:z.name,sub:z.ko,go:()=>{overview();selectZone(z.id);}});});
  FAC.forEach(fc=>{if(!fc.staff&&norm(fc.name+fc.ko).includes(ns))out.push({label:fc.ko,sub:'시설',go:()=>{showFac(fc);clearView();flyToRect(fc.rect);}});});
  return out.slice(0,8);}
let cur=[];
q.addEventListener('input',()=>{cur=search(q.value);if(!q.value.trim()){res.hidden=true;return;}
  res.innerHTML=cur.length?cur.map((r,i)=>`<li><button data-i="${i}">${esc(r.label)}<span>${esc(r.sub)}</span></button></li>`).join(''):'<li style="padding:6px 8px;font-size:12.5px;color:var(--muted)">결과 없음. 예: 니체, D-02, 카페</li>';
  res.hidden=false;res.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{cur[+b.dataset.i].go();res.hidden=true;q.blur();}));});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&cur[0]){cur[0].go();res.hidden=true;q.blur();}if(e.key==='Escape'){res.hidden=true;q.blur();}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))res.hidden=true;});

// ---------- 포인터 ----------
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(),tip=$('#tip');let down=null;
function hit(e){const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr,camera);const h=ray.intersectObjects([readMesh,pickMesh,...facPick],false)[0];if(!h)return null;
  if(h.object===readMesh)return{book:h.instanceId};if(h.object===pickMesh)return{face:h.instanceId};return{fac:h.object.userData.fac};}
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>5)return;
  const h=hit(e);if(!h)return;if(h.book!=null)showFace(reads[h.book].face,h.book);else if(h.face!=null)showFace(h.face);else showFac(h.fac);});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons){tip.hidden=true;return;}
  const h=hit(e);renderer.domElement.style.cursor=h?'pointer':'';if(!h){tip.hidden=true;return;}
  const r=stage.getBoundingClientRect();
  tip.textContent=h.book!=null?reads[h.book].book.t+(reads[h.book].book.c==='M'?' (추정)':''):h.face!=null?faces[h.face].id+' · '+(faces[h.face].real?faces[h.face].real.cat:faces[h.face].zone.name):h.fac.ko;
  tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.hidden=false;});
renderer.domElement.addEventListener('pointerleave',()=>tip.hidden=true);

// ---------- 걷기 ----------
const keys=new Set();
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input'))return;const k=e.key.toLowerCase();if(['w','a','s','d','shift'].includes(k))keys.add(k);});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
const fw=new THREE.Vector3(),rt=new THREE.Vector3(),mvv=new THREE.Vector3();
function walk(dt){if(!keys.size)return;fw.subVectors(controls.target,camera.position);fw.y=0;if(fw.lengthSq()<1e-6)return;fw.normalize();rt.set(-fw.z,0,fw.x);mvv.set(0,0,0);
  if(keys.has('w'))mvv.add(fw);if(keys.has('s'))mvv.sub(fw);if(keys.has('d'))mvv.add(rt);if(keys.has('a'))mvv.sub(rt);if(!mvv.lengthSq())return;
  mvv.normalize().multiplyScalar((keys.has('shift')?9:3.5)*dt);camera.position.add(mvv);controls.target.add(mvv);clearView();}

// ---------- 루프 ----------
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
const clock=new THREE.Clock(),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
controls.addEventListener('start',()=>{fly=null;});
function tick(){const dt=Math.min(clock.getDelta(),0.05);
  if(fly){const t=Math.min(1,(performance.now()-fly.s)/fly.dur),k=ease(t);camera.position.lerpVectors(fly.p0,fly.p1,k);controls.target.lerpVectors(fly.t0,fly.t1,k);if(t>=1)fly=null;}
  else walk(dt);
  controls.update();renderer.render(scene,camera);requestAnimationFrame(tick);}
$('#loading').remove();tick();
})();
</script>

</body>
</html>
